        title: "Perguntas frequentes"
        q1: "O que diferencia isso do Google Flights?"
        a1: "O Google Flights mostra preços. Nós dizemos o que fazer com eles. Nosso motor pontua cada combinação de datas em toda a sua janela flexível e fornece uma recomendação única e clara, com nível de confiança e explicação em linguagem simples."
        q2: "O que é um crédito de busca?"
        a2: "Um crédito = uma análise completa da sua janela de viagem. Coletamos preços em toda a faixa de datas, pontuamos cada opção por preço, conforto e adequação, e retornamos uma recomendação completa — melhores datas, diretiva de reserva, contexto de preço e voos classificados."
        q3: "E se eu não tiver flexibilidade de datas?"
        a3: "Este produto foi feito para a flexibilidade. Se você tem datas fixas, o Google Flights ou o Skyscanner irão servi-lo melhor. Nosso valor está exatamente na análise de um intervalo de opções possíveis."
        q4: "Os créditos expiram?"
        a4: "Não. Os créditos ficam na sua conta até você usá-los. Compre uma vez, busque quando quiser."
