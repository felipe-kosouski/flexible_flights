default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", "5434") %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres") %>

development:
  primary:
    <<: *default
    database: flexible_flights_development
  queue:
    <<: *default
    database: flexible_flights_development
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: flexible_flights_development
    migrations_paths: db/cable_migrate

test:
  <<: *default
  database: flexible_flights_test

production:
  primary: &primary_production
    <<: *default
    database: flexible_flights_production
    username: flexible_flights
    password: <%= ENV["FLEXIBLE_FLIGHTS_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: flexible_flights_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: flexible_flights_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: flexible_flights_production_cable
    migrations_paths: db/cable_migrate
